<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Analyzer</title>
</head>

<body>

    <h1>Text Analyzer</h1>

    <p>Enter some text below:</p>

    <textarea id="textInput" rows="10" cols="50"></textarea>

    <br><br>

    <button id="analyzeButton">Analyze Text</button>

    <h2>Results</h2>

    <p>Words: <span id="wordCount">-</span></p>
    <p>Characters: <span id="characterCount">-</span></p>
<script src="script.js"></script>
</body>
</html>
